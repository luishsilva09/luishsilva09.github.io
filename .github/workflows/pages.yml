# Gera o site (npm run build) e publica no GitHub Pages a cada push na main.
# Por que uma Action: o site agora tem um passo de geração (páginas pt/en,
# imagens WebP, sitemap). Assim os arquivos gerados não vão para o git e
# ninguém precisa lembrar de rodar o build antes do push.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo cancela o que ainda está esperando.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O build falha (e nada é publicado) se faltar print ou se pt/en divergirem.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
